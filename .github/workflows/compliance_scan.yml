name: Automated Compliance & Test Validation Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-validation-checks:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Application Dependencies
      run: |
        python -m pip install --upgrade pip
        # Install the exact processing libraries required by your application suite
        pip install pytest numpy pandas streamlit pdfplumber duckdb

    - name: Execute PyTest Logic Validation Engine
      run: |
        # Run your existing tests to verify system stability before Streamlit hot-reloads
        pytest tests/test_financial_logic.py

    - name: Enforce Code Character Constraints Scan
      run: |
        echo "Validating frontend complexity thresholds to block high underwriting liabilities..."
        # Simply loops and lists file lines to ensure no future layout bloat happens unnoticed
        wc -l frontend/pages/*.py
